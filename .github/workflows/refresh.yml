name: Refresh generated pages

# Daily: regenerates the ADR pages and the glossary (product doc in meritum-design-system),
# the contract reference (JSON Schema in meritum-core) and the repo map (GitHub org), then
# opens or updates one PR to main when anything changed. Hand-written pages are never
# touched: scripts/generate.py only writes files that carry its marker.
#
# MERITUM_BOT_TOKEN: fine-grained PAT, read-only (Contents: read, Metadata: read) on the org's
# repositories; it reads the other repos. The push and the PR use GITHUB_TOKEN, which does not
# start CI on the pushed branch, so the strict build runs here before the PR is opened.
on:
  schedule:
    - cron: "17 4 * * *" # 04:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh
  cancel-in-progress: false

env:
  BRANCH: chore/refresh-generated
  ORG: Meritum-HackNation2026

jobs:
  refresh:
    runs-on: [self-hosted, meritum]
    timeout-minutes: 15
    steps:
      - name: Check MERITUM_BOT_TOKEN
        id: token
        env:
          BOT_TOKEN: ${{ secrets.MERITUM_BOT_TOKEN }}
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "::warning::MERITUM_BOT_TOKEN is not set; skipping the refresh (README, section Odświeżanie)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.skip != 'true'
        with:
          ref: main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.skip != 'true'
        with:
          repository: Meritum-HackNation2026/meritum-design-system
          ref: main
          path: _src/design-system
          token: ${{ secrets.MERITUM_BOT_TOKEN }}
          sparse-checkout: docs
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.skip != 'true'
        with:
          repository: Meritum-HackNation2026/meritum-core
          ref: main
          path: _src/core
          token: ${{ secrets.MERITUM_BOT_TOKEN }}
          sparse-checkout: contracts
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: steps.token.outputs.skip != 'true'
        with:
          enable-cache: false

      - name: Regenerate
        if: steps.token.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.MERITUM_BOT_TOKEN }}
        run: |
          uv sync --locked
          uv run python scripts/test_generate.py
          uv run python scripts/generate.py \
            --product-doc _src/design-system/docs/product-doc.html \
            --schema _src/core/contracts/meritum.schema.json \
            --org "$ORG"
          uv run zensical build --strict --clean

      - name: Open or update the PR to main
        if: steps.token.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add docs
          if git diff --cached --quiet; then
            echo "Generated pages are up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Odśwież strony generowane z dokumentu produktowego, kontraktów i listy repozytoriów"
          git push --force origin "HEAD:refs/heads/$BRANCH"

          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth="Authorization: Bearer $GH_TOKEN"
          open=$(curl -fsS -H "$auth" "$api/pulls?state=open&base=main&head=$ORG:$BRANCH" | jq length)
          if [ "$open" != "0" ]; then
            echo "PR already open; the branch was updated."
            exit 0
          fi
          body=$(jq -n --arg b "$BRANCH" '{
            title: "Odśwież strony generowane",
            head: $b,
            base: "main",
            body: "Codzienne odświeżenie stron generowanych przez `scripts/generate.py`: decyzje ADR i słownik z dokumentu produktowego (meritum-design-system, `main`), referencja kontraktów z `contracts/meritum.schema.json` (meritum-core, `main`) i mapa repozytoriów organizacji.\n\nStrony pisane ręcznie się nie zmieniły. Build `zensical build --strict` przeszedł w tym przebiegu. Gałąź nadpisuje każdy kolejny przebieg, więc poprawki wprowadza się u źródła, nie tutaj."
          }')
          # needs "Allow GitHub Actions to create and approve pull requests" (org and repo settings)
          if ! curl -fsS -X POST -H "$auth" -H "Accept: application/vnd.github+json" "$api/pulls" -d "$body" | jq -r .html_url; then
            echo "::warning::Could not open the PR with GITHUB_TOKEN; open it by hand: https://github.com/$GITHUB_REPOSITORY/compare/main...$BRANCH"
          fi
