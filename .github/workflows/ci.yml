name: CI

# Strict Zensical build on every push: a warning, a broken link or a missing anchor fails it.
# main then deploys to production on Cloudflare Pages.
# No e2e or cross-component tests here (AGENTS.md).
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: [self-hosted, meritum]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false # ~/.cache/uv stays on the self-hosted runner
      - run: uv sync --locked
      - run: uv run zensical build --strict --clean

      - name: Check Cloudflare secrets
        id: cf
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; the site was built but not deployed (README, section Cloudflare Pages)"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.cf.outputs.deploy == 'true'
        with:
          node-version: 26
      - name: Deploy to Cloudflare Pages
        if: steps.cf.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # --branch main is the production branch of the meritum-docs project, any other is a preview
        run: >-
          npx --yes wrangler@4.166.0 pages deploy site
          --project-name meritum-docs
          --branch "$GITHUB_REF_NAME"
          --commit-hash "$GITHUB_SHA"
          --commit-dirty=true
